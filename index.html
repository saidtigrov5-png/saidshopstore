<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SAIDSHOPSTORE</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial}header{padding:20px;border-bottom:1px solid #333;display:flex;justify-content:space-between}.hero{padding:60px 20px;background:linear-gradient(135deg,#000,#111827)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:20px}.card{background:#111;border:1px solid #222;border-radius:16px;padding:16px;text-align:center}button{background:#16a34a;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:bold}.price{color:#4ade80;font-size:22px}</style></head><body><header><h2>SAIDSHOPSTORE</h2><div>🛒 <span id=c>0</span></div></header><section class=hero><h1>SAID SHOP STORE</h1><p>BMW E39 • Fashion • Tech • Tajikistan</p></section><section class=grid id=g></section><script>const items=[['👟','Nike Air Force',599],['🚗','ABS BMW E39',180],['👕','Oversize Hoodie',350],['📱','iPhone Case',120],['💡','LED BMW',250],['⚙️','BMW Steering',900]];let cart=0;const g=document.getElementById('g');items.forEach(i=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div style="font-size:60px">${i[0]}</div><h3>${i[1]}</h3><div class=price>${i[2]} сомони</div><button>Добавить</button>`;d.querySelector('button').onclick=()=>{cart++;document.getElementById('c').textContent=cart};g.appendChild(d)})</script></body></html>
